name: Setup pinned tools and dependencies
description: Hermit and frozen pnpm install; optionally provision pinned browsers.
inputs:
  browsers:
    description: Install Chromium and WebKit plus Linux system libraries
    default: "false"
runs:
  using: composite
  steps:
    - name: Cache Hermit packages
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ runner.os == 'macOS' && '~/Library/Caches/hermit/pkg' || '~/.cache/hermit/pkg' }}
        # Cache contents depend on which tools this job actually provisions.
        # A faster JS-only job must not freeze an incomplete cache for Rust jobs.
        key: hermit-${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('bin/**') }}
    - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
    - name: Resolve pnpm store
      id: pnpm
      shell: bash
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
    - name: Cache pnpm store
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.pnpm.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'bin/.pnpm-*.pkg') }}
        restore-keys: pnpm-${{ runner.os }}-${{ runner.arch }}-
    - name: Install locked dependencies
      shell: bash
      run: pnpm install --frozen-lockfile
    - name: Resolve installed Playwright version
      if: inputs.browsers == 'true'
      id: playwright
      shell: bash
      run: node -p "'version=' + require('@playwright/test/package.json').version" >> "$GITHUB_OUTPUT"
    - name: Cache Playwright engines
      if: inputs.browsers == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ runner.arch }}-${{ steps.playwright.outputs.version }}-chromium-webkit
    - name: Install pinned browser engines and libraries
      if: inputs.browsers == 'true'
      shell: bash
      run: pnpm exec playwright install --with-deps chromium webkit
