name: Desktop stable feed
run-name: Serve ${{ inputs.version }} on the stable feed

# Points installed stable apps at a published stable release. Publishing a
# release (desktop-stable.yml) never does this on its own; betas never reach it.
on:
  workflow_dispatch:
    inputs:
      version:
        description: Published stable version (X.Y.Z) to serve on the stable updater feed
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: desktop-stable-feed
  cancel-in-progress: false

jobs:
  promote:
    if: github.repository == 'block/buzz-app'
    name: Promote stable release
    runs-on: ubuntu-latest
    # Required reviewers approve each promotion; deploys only from main.
    environment: desktop-stable-feed
    timeout-minutes: 10
    permissions:
      # Reads the environment's protection rules.
      actions: read
      contents: write
    steps:
      - name: Require the reviewed workflow from main
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          test "$DISPATCH_REF" = refs/heads/main || { echo "::error::Promote from main, not $DISPATCH_REF"; exit 1; }
      # GitHub creates a missing environment without protection, so check it
      # rather than trust that it was set up.
      - name: Require an approval environment limited to main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          environment="repos/$GH_REPO/environments/desktop-stable-feed"
          gh api "$environment" --jq '
            ([.protection_rules[] | select(.type == "required_reviewers") | .reviewers | length] | add // 0) > 0
            and .deployment_branch_policy.custom_branch_policies == true' | grep -qx true ||
            { echo '::error::desktop-stable-feed needs required reviewers and a custom deployment branch policy'; exit 1; }
          branches=$(gh api "$environment/deployment-branch-policies" --jq '[.branch_policies[] | "\(.type):\(.name)"] | sort | join(",")')
          [[ "$branches" == "branch:main" ]] || { echo "::error::desktop-stable-feed must deploy only from main, not $branches"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and publish stable feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: scripts/promote-updater-feed.sh stable-feed "$VERSION"
