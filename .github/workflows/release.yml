name: Desktop previews

on:
  # A daily preview from main.
  schedule:
    - cron: "37 9 * * *"
  # A preview of each published stable release, so preview installs get its
  # code without leaving the preview feed.
  workflow_run:
    workflows: [Desktop stable release]
    types: [completed]
  workflow_dispatch:
    inputs:
      candidates:
        description: Build Windows/Linux candidates only (no publishing or macOS signing)
        type: boolean
        default: false
      promote_version:
        description: Promote a validated version (e.g. 1.0.2-preview.22.1) to the preview updater feed; no build
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: desktop-preview-${{ inputs.candidates && github.ref || 'macos-prerelease' }}
  cancel-in-progress: false

jobs:
  source:
    # Only a successful stable vX.Y.Z publication starts a preview; betas
    # (vX.Y.Z-beta.N) do not.
    if: >-
      ${{ github.repository == 'block/buzz-app' && !inputs.promote_version && (inputs.candidates || github.ref == 'refs/heads/main') &&
          (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' &&
            github.event.workflow_run.event == 'push' && !contains(github.event.workflow_run.head_branch, '-'))) }}
    name: Select preview source and version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Select the commit to build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.event.workflow_run.head_branch }}
          TAGGED_SHA: ${{ github.event.workflow_run.head_sha }}
          CANDIDATES: ${{ inputs.candidates == true }}
        run: |
          set -euo pipefail
          sha="$GITHUB_SHA"
          if [[ "$EVENT" == workflow_run ]]; then
            [[ "$TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] ||
              { echo "::error::$TAG is not a stable release tag"; exit 1; }
            sha="$TAGGED_SHA"
          fi
          if [[ "$CANDIDATES" != true ]]; then
            main=$(gh api "repos/$GH_REPO/git/ref/heads/main" --jq .object.sha)
            base=$(gh api "repos/$GH_REPO/compare/$sha...$main" --jq .merge_base_commit.sha)
            [[ "$base" == "$sha" ]] || { echo "::error::$sha is not in main history at $main"; exit 1; }
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.source.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Derive the preview version
        id: version
        run: node scripts/preview-version.mjs HEAD

  desktop:
    # Candidate-only runs may build a feature branch; previews build main.
    needs: source
    if: github.repository == 'block/buzz-app' && !inputs.promote_version && (inputs.candidates || github.ref == 'refs/heads/main')
    uses: ./.github/workflows/desktop-build.yml
    permissions:
      contents: write
      id-token: write
    secrets: inherit
    with:
      candidates: ${{ inputs.candidates == true }}
      preview_version: ${{ needs.source.outputs.version }}
      source_sha: ${{ needs.source.outputs.sha }}

  promote_preview:
    name: Promote verified preview
    needs: [desktop]
    # Explicit promotions skip the build; automatic promotions require it, including publication, to succeed.
    if: >-
      ${{ !cancelled() && github.repository == 'block/buzz-app' && github.ref == 'refs/heads/main' && !inputs.candidates &&
          ((inputs.promote_version != '' && needs.desktop.result == 'skipped') ||
           (inputs.promote_version == '' && needs.desktop.result == 'success')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify and publish preview feed
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.promote_version || needs.desktop.outputs.version }}
        run: scripts/promote-updater-feed.sh preview-feed "$VERSION"

      - name: Prune old preview releases and tags
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/prune-preview-releases.mjs --apply
