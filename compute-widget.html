<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Compute</title><script src="/appearance-init.js"></script><style>
:root{color-scheme:light dark;background:transparent}html,body,canvas{width:100%;height:100%;margin:0;display:block;overflow:hidden}canvas{border-radius:12px;background:var(--surface-inset)}body{user-select:none;cursor:default}body::after{content:"";position:fixed;inset:0;border-radius:12px;box-shadow:inset 0 0 0 1px var(--border-standard);pointer-events:none}
button{border:0;border-radius:4px;background:var(--surface-inset);color:var(--text-primary);font:12px system-ui;padding:7px;cursor:pointer}button:focus-visible{outline:1px solid var(--border-focus)}button:disabled{opacity:.6;cursor:default}
#settings-toggle{position:fixed;z-index:2;top:3vmin;left:3vmin;width:12vmin;height:12vmin;padding:2.5vmin;box-sizing:border-box;background:transparent;color:var(--text-subtle)}#settings-toggle svg{display:block;width:100%;height:100%}
#widget-settings{position:fixed;inset:0;padding:40px 12px 12px;box-sizing:border-box;overflow:auto;border-radius:12px;background:var(--surface-inset);color:var(--text-primary);font:12px system-ui}#widget-settings h1{font-size:13px;margin:0 0 12px}#widget-settings button{display:block;width:100%;text-align:left;border:1px solid var(--border-standard);margin-top:8px}#usb-status{font-size:11px;color:var(--text-subtle);overflow-wrap:anywhere;margin:8px 0 12px}
body.embedded #settings-toggle,body.embedded #widget-settings{display:none}
body.embedded::after{display:none}body.embedded canvas{border-radius:0}
</style></head><body><canvas id="display" role="img" aria-label="Compute activity"></canvas><button id="settings-toggle" type="button" aria-label="Compute widget settings" aria-controls="widget-settings" aria-expanded="false" title="Settings (⌘,)"></button><section id="widget-settings" aria-label="Compute widget settings" hidden><h1>Widget settings</h1><button id="usb-connect" type="button" aria-label="Connect USB compute display" disabled>Connect USB</button><p id="usb-status" role="status">USB requires the desktop app.</p><button id="close" type="button" aria-label="Close activity widget">Close widget</button></section><script type="module" src="/src/compute-widget.ts"></script></body></html>
