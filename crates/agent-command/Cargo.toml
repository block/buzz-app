[package]
name = "buzz-agent-command"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "net", "time", "process", "io-util"] }
url = "2"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
