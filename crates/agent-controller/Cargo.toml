[package]
name = "buzz-agent-controller"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[build-dependencies]
dotenvy = "0.15"
url = "2"

[dev-dependencies]
dotenvy = "0.15"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
strip-ansi-escapes = "0.2"
getrandom = "0.4"
tempfile = "3"
url = "2"
secp256k1 = { version = "0.33", default-features = false, features = ["std"] }
bech32 = "0.12"
zeroize = "1.9"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"
nix = { version = "0.31", features = ["user"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_SystemServices", "Win32_System_Threading"] }

[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
buzz-credential-store = { path = "../credential-store" }

[target.'cfg(target_os = "macos")'.dev-dependencies]
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
