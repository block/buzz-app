[package]
name = "buzz-community-compute"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
ed25519-dalek = "=3.0.0-rc.0"
hex = "0.4"
iroh = "1.0.3"
mesh-llm-host-runtime = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false, features = ["dynamic-native-runtime"] }
nostr = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
url = "2"

mesh-llm-sdk = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false, features = ["serving"] }
mesh-llm-client = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false }
mesh-llm-node = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false }
mesh-llm-system = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false }
mesh-llm-events = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.76.0-rc9", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "time", "macros", "io-util", "io-std", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json"] }
