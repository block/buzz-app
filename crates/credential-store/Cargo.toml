[package]
name = "buzz-credential-store"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[dependencies]
keyring = { version = "=3.6.3", default-features = false }
sha2 = "0.10"
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7"

[target.'cfg(target_os = "windows")'.dependencies]
dirs = "6"
keyring = { version = "=3.6.3", default-features = false, features = ["windows-native"] }

[dev-dependencies]
tempfile = "3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", features = ["user"] }
