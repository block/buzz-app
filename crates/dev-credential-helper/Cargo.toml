[package]
name = "buzz-dev-credential-helper"
version = "0.1.0"
license = "Apache-2.0"
edition = "2021"
rust-version = "1.89"
description = "macOS development helper that holds Keychain approvals for `just desktop me` debug builds"
publish = false

[[bin]]
name = "buzz-dev-credential-helper"
path = "src/main.rs"

[dependencies]
zeroize = "1.9"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
libc = "0.2"
nix = { version = "0.31", features = ["user"] }
security-framework = "3.7"
