[package]
name = "buzz-pairing"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Buzz NIP-AB device pairing protocol"

[dependencies]
nostr = { version = "=0.45.7", default-features = false, features = ["std", "nip44", "os-rng"] }
# nostr 0.45 keeps its ECDH and HKDF helpers private; these match the versions it
# and other workspace crates already link.
secp256k1 = { version = "0.33", default-features = false, features = ["std"] }
hkdf = "0.13"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
hex = "0.4"
rand = "0.10"
subtle = "2.6"
zeroize = "1.8"
percent-encoding = "2.3"
url = "2"
