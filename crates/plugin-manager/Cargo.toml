[package]
name = "buzzodz-plugins"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"

[[bin]]
name = "buzzodz"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
dirs = "6"
tempfile = "3"
url = "2"
cap-std = "4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
