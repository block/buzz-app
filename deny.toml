[advisories]
ignore = [
    # instant 0.1.13 — unmaintained, not vulnerable. nostr 0.44 → instant (via
    # buzz-foundation and buzz-pairing). Remove when nostr 0.44 is gone.
    { id = "RUSTSEC-2024-0384", reason = "instant via nostr 0.44; unmaintained, not vulnerable" },
    # zip 4.6.1 < 9: extraction keeps setuid/setgid bits (0367), creates symlinks
    # that escape the destination (0368) and applies permissions through symlinks
    # (0369). Only path: buzz-foundation → tauri-plugin-updater 2.13.3 → zip.
    # Only the updater's Windows ZIP install path calls ZipArchive::extract;
    # buzz-app ships a raw NSIS .exe update and installs only signature-verified
    # bytes. Recheck before publishing Windows ZIP updates. Remove when
    # tauri-plugin-updater moves to zip >= 9.
    { id = "RUSTSEC-2026-0367", reason = "zip 4.6.1 via tauri-plugin-updater; only its Windows ZIP install path extracts, and buzz-app ships an NSIS .exe" },
    { id = "RUSTSEC-2026-0368", reason = "zip 4.6.1 via tauri-plugin-updater; only its Windows ZIP install path extracts, and buzz-app ships an NSIS .exe" },
    { id = "RUSTSEC-2026-0369", reason = "zip 4.6.1 via tauri-plugin-updater; only its Windows ZIP install path extracts, and buzz-app ships an NSIS .exe" },
    # zbus 5 D-Bus crates — unmaintained, not vulnerable. Linux only:
    # buzz-foundation, tauri-plugin-opener and tauri-plugin-single-instance →
    # zbus 5. Remove when those move off zbus 5.
    { id = "RUSTSEC-2026-0370", reason = "zvariant via zbus 5 (buzz-foundation, tauri-plugin-opener, tauri-plugin-single-instance); unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0371", reason = "zbus_names via zbus 5 (buzz-foundation, tauri-plugin-opener, tauri-plugin-single-instance); unmaintained, not vulnerable" },
    { id = "RUSTSEC-2026-0372", reason = "zvariant_derive via zbus 5 (buzz-foundation, tauri-plugin-opener, tauri-plugin-single-instance); unmaintained, not vulnerable" },
    # mach 0.1.2/0.3.2 — unmaintained, not vulnerable. macOS only: user-idle 0.6
    # → mach, and user-idle → IOKit-sys/CoreFoundation-sys → mach.
    # Remove when user-idle moves to mach2 or buzz-app replaces user-idle.
    { id = "RUSTSEC-2020-0168", reason = "mach via user-idle (and its IOKit-sys/CoreFoundation-sys); unmaintained, not vulnerable" },
    # proc-macro-error 1.0.4 — unmaintained, not vulnerable. Linux GTK, build-time
    # proc macro: tauri → gtk 0.18 → glib-macros/gtk3-macros.
    # Remove when tauri's Linux stack leaves gtk-rs 0.18.
    { id = "RUSTSEC-2024-0370", reason = "proc-macro-error via tauri → gtk 0.18 → glib-macros/gtk3-macros; unmaintained, not vulnerable" },
]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "BSL-1.0",
    "Unlicense",
]
confidence-threshold = 0.8

[licenses.private]
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "allow"
