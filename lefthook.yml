# A custom group avoids Lefthook's implicit pre-commit stash/restage machinery.
# .githooks/pre-commit invokes this group; the helper owns staged-file safety.
min_version: 2.1.12
no_auto_install: true
check-staged:
  jobs:
    - name: format-and-lint
      run: bin/node scripts/check-staged.mjs
check-push:
  # Lefthook 2.1.12 shares a mutable cached stdin reader between jobs. Concurrent
  # readers can receive truncated/empty refs and silently skip validation.
  parallel: false
  jobs:
    - name: types-and-related-unit-tests
      use_stdin: true
      run: bin/node scripts/check-push.mjs
    - name: design-system
      use_stdin: true
      run: bin/node scripts/check-push.mjs --design
