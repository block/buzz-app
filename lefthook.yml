# Stock runners must stop before their unsafe partial-staging guard runs.
# Under lhm, activate Hermit (source bin/activate-hermit) before committing.
# Temporary gate: reassess before adopting any new upstream release.
min_version: 2.1.18-buzz.3
lefthook: bin/lefthook
# Without lhm, `bin/lefthook install` writes shims that fail instead of silently
# skipping when they cannot find Lefthook. lhm users install nothing: lhm merges
# this file with the machine policy at hook time.
assert_lefthook_installed: true
pre-commit:
  # Stop at the first failure. Lefthook restages every successful `stage_fixed`
  # job even when another job fails, so the read-only checks run first and a
  # failing one leaves the index untouched.
  piped: true
  jobs:
    # Refuse names Git would expand as globs when Lefthook restages them.
    - name: literal-names
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css,rs}"
      run: bin/node scripts/check-staged-names.mjs {staged_files}
    - name: icons
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json}"
      run: bin/node scripts/design-system/check-icons.mjs {staged_files}
    - name: biome
      glob: "*.{js,mjs,cjs,jsx,ts,mts,cts,tsx,json,jsonc,css}"
      stage_fixed: true
      run: bin/pnpm exec biome check --write --error-on-warnings --files-ignore-unknown=true --no-errors-on-unmatched -- {staged_files}
    - name: rustfmt
      glob: "*.rs"
      stage_fixed: true
      run: bin/rustfmt --edition 2021 -- {staged_files}
pre-push:
  # Lefthook shares one cached stdin reader between jobs; serialize so every
  # lane receives the complete ref list.
  parallel: false
  jobs:
    - name: types-and-related-unit-tests
      use_stdin: true
      run: bin/node scripts/check-push.mjs
    - name: design-system
      use_stdin: true
      run: bin/node scripts/check-push.mjs --design
    - name: rust-clippy
      use_stdin: true
      run: bin/node scripts/check-push.mjs --clippy
