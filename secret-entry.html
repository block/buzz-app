<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="/appearance-init.js"></script>
    <title>Save a credential</title>
    <link rel="stylesheet" href="/src/secret-entry/secret-entry.css" />
  </head>
  <body>
    <!-- App-owned: this window loads no plugin code. -->
    <form id="entry" autocomplete="off">
      <p id="prompt" class="prompt">Loading…</p>
      <label for="value" id="label">Value</label>
      <input id="value" type="password" spellcheck="false" autocapitalize="off" required />
      <p id="error" class="error" role="alert"></p>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save" disabled>Save</button>
      </div>
    </form>
    <script type="module" src="/src/secret-entry/main.ts"></script>
  </body>
</html>
