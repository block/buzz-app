[package]
name = "buzz-foundation"
version = "0.0.0"
description = "Buzz application foundation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
url = "2"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["unstable"] }
wry = { version = "=0.55.1", default-features = false, features = ["os-webview"] }
buzzodz-plugins = { path = "../crates/plugin-manager" }
buzz-agent-controller = { path = "../crates/agent-controller" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
buzz-agent = { git = "https://github.com/block/buzz.git", rev = "48884848f566d02c42ce07636636c4ad5f164c27" }
tokio = { version = "1", features = ["sync", "time", "macros", "process", "io-util"] }
sha2 = "0.10"
base64 = "0.22"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
url = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"
tauri = { version = "2", features = ["test"] }

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["NSScreen", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSObject", "NSThread", "NSBundle", "NSString", "NSError", "NSUserDefaults"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationSettings", "block2"] }

objc2-web-kit = { version = "=0.3.2", default-features = false, features = ["std", "objc2-app-kit", "block2", "WKWebView", "WKUIDelegate", "WKFrameInfo", "WKSecurityOrigin"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "=0.38.2"
windows-core = "=0.61.2"
tauri-winrt-notification = "=0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
gtk = "0.18"
webkit2gtk = "=2.0.2"
