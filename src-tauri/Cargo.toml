[package]
name = "buzz-foundation"
version = "0.0.0"
description = "Buzz application foundation"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "buzz_foundation_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
buzzodz-plugins = { path = "../crates/plugin-manager" }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4"] }
url = "2"

[target.'cfg(unix)'.dependencies]
portable-pty = "0.9"
libc = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "=0.6.15"
block2 = "=0.6.2"
objc2 = "=0.6.4"
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["NSBundle", "NSString", "NSError"] }
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["UNUserNotificationCenter", "UNNotificationSettings", "block2"] }

[target.'cfg(target_os = "windows")'.dependencies]
tauri-winrt-notification = "=0.8.1"

[target.'cfg(target_os = "linux")'.dependencies]
tauri = { version = "2", features = ["tray-icon"] }
zbus = { version = "=5.19.0", default-features = false, features = ["async-io"] }
futures-lite = "=2.6.1"
gtk = "0.18"
