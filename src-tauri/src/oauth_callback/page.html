<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buzz sign-in</title>
    <style>{{style}}</style>
  </head>
  <body data-complete="{{complete}}" data-close-delay="{{closeDelay}}">
    <main aria-labelledby="heading">
      <div class="brand">{{brand}}<span>Buzz</span></div>
      <h1 id="heading">{{heading}}</h1>
      <p>{{message}}</p>
      <div class="actions">
        <button id="close-window" type="button" hidden>Close this window</button>
        <button id="keep-open" class="secondary" type="button" hidden>Keep open</button>
      </div>
      <p id="close-hint" class="hint" role="status">You can close this window.</p>
    </main>
    <script>{{script}}</script>
  </body>
</html>
