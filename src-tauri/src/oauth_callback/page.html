<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Buzz sign-in</title>
    <style>{{style}}</style>
  </head>
  <body data-complete="{{complete}}" data-close-delay="{{closeDelay}}">
    <main aria-labelledby="heading">
      <div class="brand">{{brand}}<span>Buzz</span></div>
      <h1 id="heading">{{heading}}</h1>
      <p>{{message}}</p>
      <p class="hint" role="status">
        <svg id="close-spinner" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <path d="M12 3a9 9 0 1 0 9 9" />
        </svg>
        <span class="hint-copy">
          <span id="closing-hint">Closing this window automatically</span>
          <span id="close-hint">You can close this tab.</span>
        </span>
      </p>
    </main>
    <script>{{script}}</script>
  </body>
</html>
