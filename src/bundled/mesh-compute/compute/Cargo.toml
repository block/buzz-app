[package]
name = "buzz-mesh-compute"
version = "0.1.0"
edition = "2021"
rust-version = "1.89"
license = "Apache-2.0"

[dependencies]
tempfile = "3"
serde = { version = "1", features = ["derive"] }
mesh-llm-sdk = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.78.1", default-features = false, features = ["client", "serving"] }

mesh-llm-host-runtime = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.78.1", default-features = false, features = ["dynamic-native-runtime"] }
mesh-llm-events = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.78.1" }
mesh-llm-system = { git = "https://github.com/Mesh-LLM/mesh-llm.git", tag = "v0.78.1" }
iroh = { version = "1.3.0" }
anyhow = { version = "1" }
base64 = { version = "0.22" }
url = { version = "2" }
serde_json = { version = "1" }
uuid = { version = "1", features = ["v4"] }

tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "macros", "time", "net"] }
tauri = { version = "=2.12.4", features = ["unstable", "macos-private-api"] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
futures-util = { version = "0.3" }
tokio-util = "0.7"

nostr = { version = "=0.45.5", default-features = false, features = ["std"] }
sha2 = { version = "0.10" }
hex = { version = "0.4" }
ed25519-dalek = { version = "2" }

[dev-dependencies]
tauri = { version = "=2.12.4", features = ["test"] }
tokio = { version = "1", features = ["test-util"] }

[[test]]
name = "cross_node_worker"
path = "tests/cross_node/worker.rs"
harness = false
test = false
