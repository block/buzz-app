[package]
name = "buzz-mesh-agent"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
goose-agent = { git = "https://github.com/aaif-goose/goose", tag = "gdk-v0.1.0-alpha.12", default-features = false }
goose-context-management = { git = "https://github.com/aaif-goose/goose", tag = "gdk-v0.1.0-alpha.12", default-features = false }
goose-provider-types = { git = "https://github.com/aaif-goose/goose", tag = "gdk-v0.1.0-alpha.12", default-features = false }
goose-providers = { git = "https://github.com/aaif-goose/goose", tag = "gdk-v0.1.0-alpha.12", default-features = false, features = ["rustls-tls"] }
rmcp = { version = "3.4.1", default-features = false, features = ["schemars"] }
serde_json = "1"
serde = { version = "1", features = ["derive"] }
schemars = "1"
regex = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["macros", "rt", "sync", "time", "process", "io-util"] }
tokio-util = "0.7"

tempfile = "3"
tokio-stream = { version = "0.1", features = ["io-util"] }
process-wrap = { version = "9", default-features = false, features = ["std", "process-session"] }
libc = "0.2"
which = "8"
tracing = "0.1"

[dev-dependencies]
test-case = "3"
wiremock = "0.6"
